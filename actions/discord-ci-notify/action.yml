name: Discord CI notify
description: >
  Posts a Starworks repo's CI result into its thread in the Discord ⚙️・ci-builds forum: FAILED on every
  red run (naming the failed jobs), INCOMPLETE on every run in which a needed job never ran (naming them),
  RECOVERED on the first green run after a failure, PASSED for a manual run. Green after green and
  cancelled runs stay silent. Optional plumbing: a missing webhook or thread skips, and a Discord or API
  error never fails the job. Callers must not run it for pull_request events (fork PRs never get secrets).
inputs:
  needs:
    description: >
      The caller's `needs` context as JSON (pass toJSON(needs)). The action classifies the run from it:
      any failure -> failure, else any cancelled -> cancelled, else any skipped -> incomplete, else success.
    required: false
    default: ''
  result:
    description: >
      DEPRECATED (v1 accepts it for migration; prefer `needs`): a pre-aggregated result --
      success, failure, cancelled or skipped (skipped is reported as incomplete). Ignored when `needs` is set.
    required: false
    default: ''
  webhook:
    description: The forum webhook URL (pass secrets.DISCORD_CI_WEBHOOK).
    required: false
    default: ''
  threads:
    description: JSON map of repo name -> forum thread id (pass vars.DISCORD_CI_THREADS).
    required: false
    default: '{}'
  github-token:
    description: Token to read this run's jobs and the previous run (pass github.token; needs actions:read).
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        RESULT: ${{ inputs.result }}
        DISCORD_WEBHOOK: ${{ inputs.webhook }}
        THREADS: ${{ inputs.threads }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        BRANCH: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        EVENT: ${{ github.event_name }}
        HEAD_MSG: ${{ github.event.head_commit.message }}
      run: bash "$GITHUB_ACTION_PATH/notify.sh"
